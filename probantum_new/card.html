<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Paula Muchai | ProBantum</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Clash+Display:wght@500;600;700&family=Cabinet+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#04080f;
  --card:#0b1220;
  --card2:#0d1730;
  --border:rgba(255,255,255,.08);
  --txt:#ffffff;
  --muted:rgba(255,255,255,.56);
  --faint:rgba(255,255,255,.05);
  --teal:#2ee6c6;
  --blue:#5b8cff;
  --violet:#9b6bff;
  --grad:linear-gradient(135deg,var(--blue),var(--violet));
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{
  min-height:100vh;
  background:radial-gradient(circle at 20% 0%,#0a1628 0%,var(--bg) 55%);
  color:var(--txt);
  font-family:'Cabinet Grotesk',sans-serif;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:2.5rem 1.25rem;
}
.card{
  width:100%;
  max-width:400px;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:28px;
  padding:2.4rem 1.9rem 2rem;
  box-shadow:0 20px 60px rgba(0,0,0,.55);
  text-align:center;
}
.avatar{
  width:110px;
  height:110px;
  margin:0 auto 1.3rem;
  border-radius:50%;
  padding:3px;
  background:var(--grad);
}
.avatar-inner{
  width:100%;
  height:100%;
  border-radius:50%;
  background:#04080f;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}
.avatar-inner img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}
.avatar-inner .fallback{
  font-family:'Clash Display',sans-serif;
  font-size:1.9rem;
  font-weight:700;
  color:var(--txt);
}
.name{
  font-family:'Clash Display',sans-serif;
  font-size:1.7rem;
  font-weight:700;
  letter-spacing:-.02em;
}
.role{
  margin-top:.5rem;
  font-size:.72rem;
  font-weight:600;
  letter-spacing:.16em;
  text-transform:uppercase;
  color:var(--teal);
}
.role span{
  color:var(--muted);
  font-weight:400;
  letter-spacing:normal;
  text-transform:none;
}
.role b{color:var(--txt);font-weight:600}
.actions{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:.6rem;
  margin:1.7rem 0 1.4rem;
}
.action{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:.5rem;
  padding:.85rem .3rem;
  border:1px solid var(--border);
  border-radius:16px;
  background:var(--faint);
  text-decoration:none;
  color:var(--txt);
  font-size:.72rem;
  font-weight:500;
  transition:transform .18s,border-color .18s;
}
.action:hover{transform:translateY(-2px);border-color:rgba(255,255,255,.2)}
.action svg{width:20px;height:20px}
.save{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:.6rem;
  width:100%;
  padding:.95rem;
  border:none;
  border-radius:100px;
  background:var(--grad);
  color:#fff;
  font-family:'Cabinet Grotesk',sans-serif;
  font-size:1rem;
  font-weight:700;
  cursor:pointer;
  transition:transform .18s,box-shadow .18s;
}
.save:hover{transform:translateY(-1px);box-shadow:0 10px 30px rgba(91,140,255,.35)}
.save svg{width:18px;height:18px}
.divider{
  height:1px;
  background:var(--border);
  margin:1.6rem 0 1.3rem;
}
.details{
  display:flex;
  flex-direction:column;
  gap:.9rem;
  text-align:left;
}
.detail{
  display:flex;
  align-items:center;
  gap:.8rem;
  font-size:.9rem;
  color:var(--txt);
}
.detail svg{width:18px;height:18px;flex-shrink:0;color:var(--muted)}
.detail a{color:inherit;text-decoration:none}
.tags{
  margin-top:1.5rem;
  font-size:.66rem;
  font-weight:600;
  letter-spacing:.18em;
  text-transform:uppercase;
  color:var(--muted);
}
</style>
</head>
